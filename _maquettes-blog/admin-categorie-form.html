<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une Catégorie - Admin Mon Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } },
                    fontFamily: { body: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-body flex min-h-screen overflow-hidden">

    <!-- 1. SIDEBAR (Zone 1) -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col h-screen flex-shrink-0 relative overflow-hidden z-50 hidden lg:flex">
        <div class="absolute top-0 left-0 w-full h-32 bg-primary-500/10 blur-[80px] pointer-events-none"></div>

        <div class="p-6 flex items-center gap-3 relative z-10 border-b border-gray-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-blue-400 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-primary-500/20">
                B.
            </div>
            <div>
                <h2 class="text-sm font-bold text-white tracking-wide">Admin</h2>
                <p class="text-[10px] text-gray-400 font-medium uppercase tracking-widest mt-0.5">Mon Blog</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1 relative z-10">
            <a href="admin-dashboard.html" onclick="if(window.parent && window.parent.loadComponent) { event.preventDefault(); window.parent.loadComponent('mockups/admin-dashboard.html', 'Page : Tableau de bord Admin'); }" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Tableau de bord
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                Articles
            </a>
            <a href="admin-categories.html" onclick="if(window.parent && window.parent.loadComponent) { event.preventDefault(); window.parent.loadComponent('mockups/admin-categories.html', 'Page : Gestion des Catégories'); }" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg bg-primary-500/10 text-white">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                Catégories
            </a>

        </nav>

        <div class="p-4 border-t border-gray-800 relative z-10">
            <a href="admin-login.html" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-gray-400 hover:text-red-400 hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Déconnexion
            </a>
        </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- 2. TOPBAR (Zone 2) -->
        <header class="h-16 bg-white border-b border-gray-200 px-6 flex items-center justify-between flex-shrink-0 z-40">
            <div class="flex items-center gap-4 flex-1">
                <button class="lg:hidden p-2 text-gray-400 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="hidden md:block max-w-md w-full">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" placeholder="Rechercher..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-transparent rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300">
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4 ml-auto">
                <a href="public-index.html" class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors" title="Voir le site public">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    <span class="hidden lg:inline">Voir le site</span>
                </a>
                <div class="w-px h-6 bg-gray-200 mx-1 hidden sm:block"></div>
                <button class="flex items-center gap-2 pl-2">
                    <img src="https://i.pravatar.cc/100?img=11" alt="Profile" class="w-8 h-8 rounded-full object-cover border border-gray-200">
                    <div class="hidden md:flex flex-col text-left">
                        <span class="text-xs font-bold text-gray-900 leading-tight">Jean D.</span>
                        <span class="text-[10px] font-medium text-gray-500">Admin</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-400 hidden sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
            </div>
        </header>

        <!-- 3. MAIN CONTENT (Zone 3) -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-10 bg-gray-50/50">
            <div class="max-w-3xl mx-auto">
                
                <!-- Page Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                        <nav class="flex text-xs text-gray-500 mb-1" aria-label="Breadcrumb">
                            <ol class="inline-flex items-center space-x-1 md:space-x-2">
                                <li class="inline-flex items-center">
                                    <span class="text-gray-900 font-medium">Admin</span>
                                </li>
                                <li>
                                    <div class="flex items-center">
                                        <svg class="w-3 h-3 text-gray-400 mx-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                        <a href="admin-categories.html" class="text-gray-500 hover:text-gray-900 font-medium ml-1 transition-colors">Catégories</a>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center">
                                        <svg class="w-3 h-3 text-gray-400 mx-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                        <span class="text-gray-500 font-medium ml-1">Ajouter</span>
                                    </div>
                                </li>
                            </ol>
                        </nav>
                        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Ajouter une Catégorie</h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <a href="admin-categories.html" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-white text-gray-700 border border-gray-200 text-sm font-semibold rounded-lg hover:bg-gray-50 hover:text-gray-900 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                            Retour à la liste
                        </a>
                    </div>
                </div>

                <!-- Form Card -->
                <form class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden" onsubmit="event.preventDefault(); window.location.href='admin-categories.html';">
                    
                    <div class="p-6 md:p-8">
                        <div class="flex flex-col gap-6">
                            
                            <!-- Input Group: Nom -->
                            <div class="flex flex-col gap-2">
                                <label for="category_name" class="text-sm font-semibold text-gray-700">Nom de la catégorie <span class="text-red-500">*</span></label>
                                <input type="text" id="category_name" placeholder="Ex: Développement Web" required class="w-full px-4 py-2.5 bg-gray-50 border border-transparent rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300">
                                <p class="text-xs text-gray-500">Ce nom sera affiché publiquement sur le blog.</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Input Group: Couleur (Custom Select) -->
                                <div class="flex flex-col gap-2 relative">
                                    <label class="text-sm font-semibold text-gray-700">Couleur <span class="text-red-500">*</span></label>
                                    <div class="relative custom-select">
                                        <button type="button" onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full px-4 py-2.5 bg-gray-50 border border-transparent rounded-xl text-sm text-gray-900 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300 flex justify-between items-center text-left">
                                            <div class="flex items-center gap-3" id="selected_color">
                                                <span class="text-gray-400">Sélectionnez une couleur</span>
                                            </div>
                                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </button>
                                        
                                        <!-- Dropdown Menu -->
                                        <div class="hidden absolute top-full left-0 w-full mt-2 bg-white border border-gray-100 shadow-xl shadow-gray-900/5 rounded-xl z-50 p-2 flex flex-col gap-1">
                                            <button type="button" onclick="selectOption(this, 'selected_color', '<div class=\'w-3 h-3 rounded-full bg-blue-500\'></div><span class=\'font-medium\'>Bleu</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <div class="w-3 h-3 rounded-full bg-blue-500"></div> Bleu
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_color', '<div class=\'w-3 h-3 rounded-full bg-pink-500\'></div><span class=\'font-medium\'>Rose</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <div class="w-3 h-3 rounded-full bg-pink-500"></div> Rose
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_color', '<div class=\'w-3 h-3 rounded-full bg-emerald-500\'></div><span class=\'font-medium\'>Émeraude</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <div class="w-3 h-3 rounded-full bg-emerald-500"></div> Émeraude
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_color', '<div class=\'w-3 h-3 rounded-full bg-purple-500\'></div><span class=\'font-medium\'>Violet</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <div class="w-3 h-3 rounded-full bg-purple-500"></div> Violet
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_color', '<div class=\'w-3 h-3 rounded-full bg-orange-500\'></div><span class=\'font-medium\'>Orange</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <div class="w-3 h-3 rounded-full bg-orange-500"></div> Orange
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Input Group: Icône (Custom Select) -->
                                <div class="flex flex-col gap-2 relative">
                                    <label class="text-sm font-semibold text-gray-700">Icône <span class="text-red-500">*</span></label>
                                    <div class="relative custom-select">
                                        <button type="button" onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full px-4 py-2.5 bg-gray-50 border border-transparent rounded-xl text-sm text-gray-900 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300 flex justify-between items-center text-left">
                                            <div class="flex items-center gap-3" id="selected_icon">
                                                <span class="text-gray-400">Sélectionnez une icône</span>
                                            </div>
                                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </button>
                                        
                                        <!-- Dropdown Menu -->
                                        <div class="hidden absolute top-full left-0 w-full mt-2 bg-white border border-gray-100 shadow-xl shadow-gray-900/5 rounded-xl z-50 p-2 flex flex-col gap-1">
                                            <button type="button" onclick="selectOption(this, 'selected_icon', '<svg class=\'w-4 h-4 text-gray-600\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'currentColor\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4\'/></svg><span class=\'font-medium\'>Code</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg> Code
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_icon', '<svg class=\'w-4 h-4 text-gray-600\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'currentColor\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z\'/></svg><span class=\'font-medium\'>Pinceau / Crayon</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg> Pinceau / Crayon
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_icon', '<svg class=\'w-4 h-4 text-gray-600\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'currentColor\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M13 10V3L4 14h7v7l9-11h-7z\'/></svg><span class=\'font-medium\'>Éclair</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> Éclair
                                            </button>
                                            <button type="button" onclick="selectOption(this, 'selected_icon', '<svg class=\'w-4 h-4 text-gray-600\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'currentColor\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253\'/></svg><span class=\'font-medium\'>Livre</span>')" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors text-left">
                                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg> Livre
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <script>
                                function selectOption(btn, targetId, htmlContent) {
                                    // Mettre à jour le texte affiché
                                    document.getElementById(targetId).innerHTML = htmlContent;
                                    // Fermer le menu déroulant
                                    btn.parentElement.classList.add('hidden');
                                }
                                
                                // Fermer les menus au clic à l'extérieur
                                document.addEventListener('click', function(event) {
                                    if (!event.target.closest('.custom-select')) {
                                        document.querySelectorAll('.custom-select > div').forEach(el => {
                                            el.classList.add('hidden');
                                        });
                                    }
                                });
                            </script>

                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex items-center justify-end gap-3">
                        <button type="button" onclick="window.location.href='admin-categories.html'" class="px-5 py-2.5 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                            Annuler
                        </button>
                        <button type="submit" class="px-5 py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-xl hover:bg-primary-500 hover:shadow-lg hover:shadow-primary-500/30 hover:-translate-y-0.5 transition-all duration-300">
                            Enregistrer la catégorie
                        </button>
                    </div>

                </form>

            </div>
        </main>
    </div>

</body>
</html>
