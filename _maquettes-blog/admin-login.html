<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Admin Mon Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } },
                    fontFamily: { heading: ['Merriweather', 'serif'], body: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-body min-h-screen flex flex-col justify-between items-center px-4 relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute inset-0 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:20px_20px] opacity-50 pointer-events-none"></div>
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-primary-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    
    <!-- Top Spacer -->
    <div class="h-10"></div>

    <!-- MAIN CONTENT (Zone 1) -->
    <main class="w-full max-w-md relative z-10 animate-fade-in-up" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
        
        <style>
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>

        <!-- Login Card Molecule -->
        <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-8 sm:p-10 relative overflow-hidden">
            
            <!-- Glow decoration -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Logo / Header -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-primary-500 to-blue-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-primary-500/20 mb-4">
                    B.
                </div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Bienvenue</h1>
                <p class="text-sm text-gray-500 mt-1">Connectez-vous à votre espace administrateur</p>
            </div>

            <!-- Form -->
            <form class="flex flex-col gap-5 relative z-10" onsubmit="event.preventDefault(); if(window.parent && window.parent.loadComponent) { window.parent.loadComponent('mockups/admin-dashboard.html', 'Page : Tableau de bord Admin'); } else { window.location.href='admin-dashboard.html'; }">
                
                <!-- Email Group -->
                <div class="flex flex-col gap-1.5">
                    <label for="email" class="text-sm font-semibold text-gray-700">Adresse email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                        </div>
                        <input type="email" id="email" placeholder="admin@monblog.fr" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-transparent rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300">
                    </div>
                </div>

                <!-- Password Group -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center justify-between">
                        <label for="password" class="text-sm font-semibold text-gray-700">Mot de passe</label>
                        <a href="#" class="text-xs font-semibold text-primary-600 hover:text-primary-500 transition-colors">Oublié ?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-transparent rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all duration-300">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="mt-2 w-full flex justify-center items-center gap-2 px-5 py-3 bg-gray-900 text-white text-sm font-semibold rounded-xl hover:bg-primary-600 hover:shadow-lg hover:shadow-primary-500/25 hover:-translate-y-0.5 transition-all duration-300">
                    Se connecter
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>

            </form>
        </div>

    </main>

    <!-- FOOTER (Zone 2) -->
    <!-- Simple Footer Molecule -->
    <footer class="w-full py-8 text-center flex flex-col items-center gap-4 relative z-10 animate-fade-in-up" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 200ms both;">
        <div class="flex items-center gap-6 text-sm font-medium text-gray-500">
            <a href="public-index.html" class="hover:text-primary-600 transition-colors">Retour au site public</a>
            <span class="w-1 h-1 rounded-full bg-gray-300"></span>
            <a href="#" class="hover:text-primary-600 transition-colors">Mot de passe oublié</a>
        </div>
        <p class="text-xs text-gray-400">
            &copy; 2026 Mon Blog Personnel.
        </p>
    </footer>

</body>
</html>
