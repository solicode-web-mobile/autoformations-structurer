<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Nodes -->
  <!-- Controller -->
  <rect x="20" y="70" width="180" height="60" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">CategorieController</text>
  <text x="110" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Orchestre</text>

  <!-- Gestion -->
  <rect x="320" y="70" width="180" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="410" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GestionCategorie</text>
  <text x="410" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Logique</text>

  <!-- Entite -->
  <rect x="620" y="70" width="180" height="60" rx="8" fill="#f3f0ff" stroke="#7253ed" stroke-width="2"/>
  <text x="710" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Categorie</text>
  <text x="710" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Donnée</text>

  <!-- Edges -->
  <!-- Controller -> Gestion -->
  <path d="M 200 85 L 310 85" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="78" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">1. Demande liste</text>

  <!-- Gestion -> Entite -->
  <path d="M 500 100 L 610 100" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="555" y="93" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2. Crée et stocke</text>

  <!-- Gestion .> Controller -->
  <path d="M 320 115 L 210 115" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <text x="255" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">3. Retourne array d'objets</text>

</svg>
