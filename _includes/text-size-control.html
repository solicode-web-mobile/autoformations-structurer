<div class="text-size-control" role="group" aria-label="Taille du texte">

  <button
    type="button"
    class="text-size-button"
    data-text-size-action="decrease"
    aria-label="Réduire la taille du texte"
    title="Réduire le texte">
    A−
  </button>

  <button
    type="button"
    class="text-size-button"
    data-text-size-action="reset"
    aria-label="Réinitialiser la taille du texte"
    title="Taille normale">
    A
  </button>

  <button
    type="button"
    class="text-size-button"
    data-text-size-action="increase"
    aria-label="Agrandir la taille du texte"
    title="Agrandir le texte">
    A+
  </button>

</div>
