<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Editor - In Browser</title>
    
    <!-- Tailwind CSS (CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'spartel-orange': '#F97316',
                        'editor-bg': '#1E1E1E', // vs-dark background
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js Components & App -->
    <script src="./assets/js/components/tabs.js"></script>
    <script src="./assets/js/app.js"></script>

    <!-- Monaco Editor (via RequireJS) & Initialisation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="./assets/js/editor-init.js"></script>
    <script src="./assets/js/live-preview.js"></script>
    
    <!-- Exécution PHP via WebAssembly -->
    <script defer src="./assets/js/php-runner.js"></script>

    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans text-gray-800">

    <!-- En-tête -->
    <header class="bg-white shadow-sm px-2 py-2 flex justify-between items-center z-10" x-data="phpComponent">
        <div class="flex items-center space-x-2" x-show="hasPhp">
            <span class="text-[10px] sm:text-xs px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-medium">PHP 8.2 & Web</span>
        </div>
        
        <div class="flex space-x-2">
            <button 
                @click="if(confirm('Voulez-vous vraiment réinitialiser tout le code de cet exercice ?')) $dispatch('reset-editor')"
                class="px-2 py-1.5 sm:px-3 text-xs font-medium text-gray-600 bg-gray-200 rounded hover:bg-gray-300 transition-colors flex items-center"
                title="Réinitialiser">
                <svg class="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span class="hidden sm:inline">Réinitialiser</span>
            </button>
            <button 
                x-show="hasPhp"
                @click="runPhp"
                :disabled="isLoading"
                :class="isLoading ? 'bg-orange-400 cursor-not-allowed' : 'bg-spartel-orange hover:bg-orange-600'"
                class="px-2 py-1.5 sm:px-3 text-xs font-medium text-white rounded shadow transition-colors flex items-center"
                title="Exécuter PHP">
                <!-- Icône Play -->
                <svg x-show="!isLoading" class="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <!-- Spinner Chargement -->
                <svg x-show="isLoading" class="animate-spin -ml-1 sm:mr-1 h-4 w-4 text-white" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="hidden sm:inline" x-text="buttonText">Exécuter PHP</span>
            </button>
        </div>
    </header>

    <!-- Corps de l'application (Split 50/50 Responsive) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden" x-data="tabsComponent">
        
        <!-- Zone Gauche : Éditeur (Monaco) -->
        <section class="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-gray-300 bg-editor-bg flex-1 md:flex-none">
            
            <!-- Système d'onglets (Alpine.js) -->
            <div class="flex bg-gray-900 overflow-x-auto custom-scrollbar flex-none">
                <template x-for="tab in tabs" :key="tab.id">
                    <button 
                        @click="activeTab = tab.id"
                        :class="activeTab === tab.id ? 'bg-editor-bg text-white border-t-2 border-spartel-orange' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800 border-t-2 border-transparent'"
                        class="px-4 py-2 text-sm font-medium transition-colors outline-none whitespace-nowrap"
                        x-text="tab.label"
                    ></button>
                </template>
            </div>

            <!-- Conteneur de l'éditeur -->
            <div id="monaco-editor-container" class="flex-1 w-full h-full relative">
                <div class="absolute inset-0 flex items-center justify-center text-gray-500">
                    <!-- Placeholder en attendant Monaco au Sprint 2 -->
                    Chargement de l'éditeur...
                </div>
            </div>
        </section>

        <!-- Zone Droite : Rendu / Console -->
        <section class="w-full md:w-1/2 bg-white flex flex-col relative flex-1 min-h-[40vh] md:min-h-0">
            
            <!-- Affichage Web (HTML/CSS/JS) -->
            <div class="flex-1 flex flex-col" x-show="activeTab !== 'php'" style="display: none;">
                <div class="bg-gray-200 px-4 py-2 text-xs font-mono text-gray-600 border-b border-gray-300 flex items-center overflow-hidden">
                    <span class="w-3 h-3 rounded-full bg-red-400 mr-2 flex-shrink-0"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-400 mr-2 flex-shrink-0"></span>
                    <span class="w-3 h-3 rounded-full bg-green-400 mr-4 flex-shrink-0"></span>
                    
                    <!-- Fausse barre d'adresse/titre (Sprint 11) -->
                    <div class="flex-1 bg-white rounded-md px-3 py-1 flex items-center border border-gray-300 shadow-inner truncate">
                        <svg class="w-3 h-3 mr-2 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                        <span id="browser-title" class="truncate text-gray-700">Aperçu en direct</span>
                    </div>
                </div>
                <!-- Iframe -->
                <iframe id="live-preview" class="w-full flex-1 border-none bg-white min-h-0"></iframe>
                
                <!-- Console JS Virtuelle (Sprint 9) -->
                <div id="js-console-container" class="h-1/3 bg-gray-900 flex flex-col border-t border-gray-700" style="display: none;">
                    <div class="bg-gray-800 px-4 py-1 text-[10px] font-mono text-gray-400 border-b border-gray-700 flex justify-between">
                        <span>Console JS</span>
                        <button onclick="document.getElementById('js-console').innerHTML=''" class="hover:text-white transition-colors">Clear</button>
                    </div>
                    <pre id="js-console" class="flex-1 p-3 text-[11px] sm:text-xs font-mono text-green-400 overflow-y-auto whitespace-pre-wrap"></pre>
                </div>
            </div>

            <!-- Affichage Console (PHP) -->
            <div class="flex-1 flex flex-col bg-gray-900" x-show="activeTab === 'php'" style="display: none;">
                <div class="bg-gray-800 px-4 py-2 text-xs font-mono text-gray-400 border-b border-gray-700">
                    Terminal PHP
                </div>
                <pre id="php-console" class="flex-1 p-4 text-sm font-mono text-gray-300 overflow-y-auto">Sortie PHP (Sprint 4)</pre>
            </div>

        </section>
    </main>

</body>
</html>
